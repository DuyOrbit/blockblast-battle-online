# fly.toml app configuration file generated for blockblast-battle-online
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'blockblast-battle-online'
primary_region = 'sin'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[http_service.checks]]
  interval = '10s'
  timeout = '2s'
  grace_period = '10s'
  method = 'get'
  path = '/health'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
